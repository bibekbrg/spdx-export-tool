[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spdx-export-tool"
version = "0.1.0"
description = "Convert compliance scan records (JSON/CSV) into validated SPDX 2.3 JSON reports."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bibek Roy" }]
dependencies = ["jsonschema"]

[project.scripts]
spdx-export = "spdx_export.cli:main"
spdx-export-benchmark = "spdx_export.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spdx_export = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
